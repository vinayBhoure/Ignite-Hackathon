<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aevora — sign in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300;12..96,400;12..96,500;12..96,600;12..96,700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --smog-900:#15181A; --smog-850:#1C2022; --smog-800:#232829; --smog-700:#2F3537;
  --smog-600:#454C4E; --bone:#ECE9E0; --bone-dim:#8E948F;
  --lamp:#E8A33D; --clean:#4FD48A;
  --sev:#A52C24; --vpoor:#E4553F; --sat:#9DC64A;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--smog-900); color:var(--bone);
  font-family:"Bricolage Grotesque","Segoe UI",Helvetica,Arial,sans-serif;
  font-size:16px; line-height:1.5; overflow:hidden;
}
.mono{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums}

.scene{position:fixed;inset:0;overflow:hidden}
.backdrop{position:absolute;inset:0;width:100%;height:100%;display:block}

/* darkening scrim so the form stays readable once the scene settles */
.scrim{
  position:absolute;inset:0;opacity:0;
  background:radial-gradient(120% 90% at 50% 46%, rgba(10,12,13,.90) 0%, rgba(10,12,13,.72) 42%, rgba(10,12,13,.30) 100%);
}

/* ---------- centred brand + form ---------- */
.center{
  position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:clamp(22px,3.4vh,40px);
  padding:24px;text-align:center
}
.brand{opacity:0}
.mark{
  margin:0;font-size:clamp(52px,11vw,132px);line-height:.9;font-weight:700;
  letter-spacing:-.05em;color:var(--clean);
  text-shadow:0 0 60px rgba(79,212,138,.30)
}
.mark-sub{margin:clamp(6px,1.2vh,14px) 0 0;font-size:clamp(11px,1.3vw,15px);color:var(--bone-dim);letter-spacing:.06em}
.mark-sub em{font-style:normal;color:var(--clean);font-weight:600}

.card{
  opacity:0;width:min(400px,100%);text-align:left;
  background:rgba(28,32,34,.78);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:1px solid var(--smog-700);border-radius:14px;padding:26px 26px 22px
}
.card h2{margin:0 0 4px;font-size:19px;font-weight:600;letter-spacing:-.02em}
.card .sub{margin:0 0 20px;font-size:13px;color:var(--bone-dim)}
.seg{display:flex;border:1px solid var(--smog-600);border-radius:8px;overflow:hidden;margin-bottom:18px}
.seg button{
  flex:1;font-family:inherit;font-size:13px;padding:8px;border:0;cursor:pointer;
  background:transparent;color:var(--bone-dim)
}
.seg button[aria-pressed="true"]{background:var(--smog-700);color:var(--bone);font-weight:600}
.seg button:focus-visible{outline:2px solid var(--lamp);outline-offset:-2px}
.f{margin-bottom:13px}
.f label{display:block;font-size:12px;color:var(--bone-dim);margin-bottom:5px}
.f input{
  width:100%;font-family:inherit;font-size:14.5px;color:var(--bone);
  background:var(--smog-850);border:1px solid var(--smog-700);border-radius:8px;padding:10px 12px
}
.f input::placeholder{color:#5E6462}
.f input:focus{outline:2px solid var(--lamp);outline-offset:1px;border-color:var(--smog-600)}
.submit{
  width:100%;margin-top:7px;font-family:inherit;font-size:14.5px;font-weight:600;
  color:#12140F;background:var(--lamp);border:0;border-radius:9px;padding:12px;cursor:pointer
}
.submit:hover{filter:brightness(1.06)}
.submit:focus-visible{outline:2px solid var(--bone);outline-offset:2px}
.alt{margin:14px 0 0;font-size:12.5px;color:var(--bone-dim);text-align:center}
.alt a{color:var(--bone);text-decoration:none;box-shadow:inset 0 -1px 0 var(--smog-600)}
.alt a:hover{box-shadow:inset 0 -1px 0 var(--lamp)}

/* ---------- replay control (no intro text) ---------- */
.replay-standalone{
  position:absolute;left:50%;bottom:clamp(20px,4vh,36px);transform:translateX(-50%);
  opacity:0;z-index:4
}
.scene.playing .replay-standalone{animation:fadeIn .7s 6.9s ease-out forwards}
.scene:not(.playing) .replay-standalone{opacity:1}
.ghost{
  font-family:inherit;font-size:12px;color:var(--bone-dim);background:transparent;
  border:1px solid var(--smog-700);border-radius:6px;padding:6px 14px;cursor:pointer
}
.ghost:hover{color:var(--bone);border-color:var(--smog-600)}
.ghost:focus-visible{outline:2px solid var(--lamp);outline-offset:2px}

.skip{position:absolute;right:clamp(16px,4vw,32px);top:clamp(16px,4vh,30px);z-index:5}
.scene:not(.playing) .skip{display:none}

/* =================== TIMELINE =================== */
@keyframes smogOffL{to{transform:translate3d(-62%,-6%,0);opacity:0}}
@keyframes smogOffR{to{transform:translate3d(62%,-6%,0);opacity:0}}
@keyframes fadeOut{to{opacity:0}}
@keyframes fadeIn{to{opacity:1}}
@keyframes cityIn{from{opacity:.28}to{opacity:1}}
@keyframes ride{from{transform:translate3d(-420px,0,0)}to{transform:translate3d(1560px,0,0)}}
@keyframes bob{0%,100%{transform:translateY(0)}25%{transform:translateY(-2px)}60%{transform:translateY(1.5px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes flutter{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(6deg)}}
@keyframes streak{0%{opacity:0;transform:translateX(30px)}40%{opacity:.5}100%{opacity:0;transform:translateX(-90px)}}
@keyframes markIn{from{opacity:0;transform:translateY(16px) scale(.94)}to{opacity:1;transform:none}}
@keyframes cardIn{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes beamPulse{0%,100%{opacity:.75}50%{opacity:1}}

.playing .sky-smog{animation:fadeOut 2.4s 1.15s ease-in-out forwards}
.playing .smog-l{animation:smogOffL 2.7s 1.05s cubic-bezier(.36,.02,.2,1) forwards}
.playing .smog-r{animation:smogOffR 2.7s 1.15s cubic-bezier(.36,.02,.2,1) forwards}
.playing .smog-mid{animation:smogOffR 2.5s .95s cubic-bezier(.36,.02,.2,1) forwards}
.playing .city{animation:cityIn 2.2s 1.2s ease-out forwards}
.playing .rider{animation:ride 4.1s 2.15s cubic-bezier(.34,.02,.32,1) forwards}
.playing .bob{animation:bob .6s linear infinite}
.playing .spin{animation:spin .55s linear infinite;transform-box:fill-box;transform-origin:center}
.playing .tail{animation:flutter .44s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.playing .streaks line{animation:streak .72s linear infinite}
.playing .streaks line:nth-child(2){animation-delay:.18s}
.playing .streaks line:nth-child(3){animation-delay:.34s}
.playing .streaks line:nth-child(4){animation-delay:.1s}
.playing .beam{animation:beamPulse 1.2s ease-in-out infinite}
.playing .scrim{animation:fadeIn 1.4s 5.4s ease-out forwards}
.playing .brand{animation:markIn 1s 5.6s cubic-bezier(.16,.9,.28,1) forwards}
.playing .card{animation:cardIn .8s 6.6s cubic-bezier(.16,.9,.28,1) forwards}

/* settled / skipped state */
.scene:not(.playing) .sky-smog,
.scene:not(.playing) .smog-l,
.scene:not(.playing) .smog-r,
.scene:not(.playing) .smog-mid,
.scene:not(.playing) .rider{opacity:0}
.scene:not(.playing) .city{opacity:1}
.scene:not(.playing) .scrim,
.scene:not(.playing) .brand,
.scene:not(.playing) .card{opacity:1}

@media(prefers-reduced-motion:reduce){
  .playing *{animation:none !important}
  .playing .sky-smog,.playing .smog-l,.playing .smog-r,.playing .smog-mid,
  .playing .rider{opacity:0}
  .playing .city,.playing .scrim,.playing .brand,.playing .card{opacity:1}
}

@media(max-width:560px){
  .card{padding:22px 20px 18px}
}
</style>
</head>

<button class="ghost skip" id="skip" type="button">Skip</button>

  <div class="center">
    <div class="brand">
      <h1 class="mark">Aevora</h1>
      <p class="mark-sub">Powered by <em>Neo4j</em></p>

    <div class="card">
      <h2>Sign in</h2>
      <p class="sub">Route your riders around the worst air in NCR.</p>

      <div class="seg" role="group" aria-label="Account type">
        <button type="button" id="tabDispatch" aria-pressed="true">Dispatcher</button>
        <button type="button" id="tabRider" aria-pressed="false">Rider</button>
      </div>

      <div class="f">
        <label for="who" id="whoLabel">Work email</label>
        <input id="who" type="email" autocomplete="username" placeholder="you@company.in">
      </div>
      <div class="f">
        <label for="pw">Password</label>
        <input id="pw" type="password" autocomplete="current-password" placeholder="••••••••">
      </div>
      <button class="submit" type="button">Sign in</button>
      <p class="alt">Lost your password? <a href="#">Reset it</a></p>
    </div>
  </div>

  <button class="ghost replay-standalone" id="replay" type="button">Replay intro</button>

</div>

<script>
(function(){
  var scene = document.getElementById('scene');
  var timer;
  function settle(ms){ clearTimeout(timer); timer = setTimeout(function(){ scene.classList.remove('playing'); }, ms); }
  settle(8100);

  document.getElementById('skip').addEventListener('click', function(){
    clearTimeout(timer); scene.classList.remove('playing');
  });
  document.getElementById('replay').addEventListener('click', function(){
    scene.classList.remove('playing'); void scene.offsetWidth; scene.classList.add('playing'); settle(8100);
  });

  var d = document.getElementById('tabDispatch'), r = document.getElementById('tabRider');
  var who = document.getElementById('who'), lab = document.getElementById('whoLabel');
  d.addEventListener('click', function(){
    d.setAttribute('aria-pressed','true'); r.setAttribute('aria-pressed','false');
    lab.textContent = 'Work email'; who.type='email'; who.placeholder='you@company.in';
  });
  r.addEventListener('click', function(){
    r.setAttribute('aria-pressed','true'); d.setAttribute('aria-pressed','false');
    lab.textContent = 'Phone number'; who.type='tel'; who.placeholder='+91 ';
  });
})();
</script>
</body>
</html>
